# LAB 01 — базовый reverse proxy.
# Сохраняем основной Nginx на порту 80 без изменений.
# Новый учебный Nginx слушает только локальный IPv4-адрес: 127.0.0.1:8081.
server {
    listen 127.0.0.1:8081;
    server_name localhost;

    access_log /var/log/nginx/reverse_proxy_lab_access.log;
    error_log  /var/log/nginx/reverse_proxy_lab_error.log warn;

    location / {
        proxy_pass http://127.0.0.1:8000;
    }
}
