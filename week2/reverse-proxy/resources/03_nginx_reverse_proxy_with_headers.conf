# LAB 03 — расширенная версия ТОГО ЖЕ сайта, не второй сайт.
# Не включайте одновременно с 01: оба пытаются слушать 127.0.0.1:8081.
# Вместо этого замените содержимое файла /etc/nginx/sites-available/reverse-proxy-lab.
server {
    listen 127.0.0.1:8081;
    server_name localhost;

    access_log /var/log/nginx/reverse_proxy_lab_access.log;
    error_log  /var/log/nginx/reverse_proxy_lab_error.log warn;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
